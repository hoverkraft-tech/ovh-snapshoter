{{- if .Values.deployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      # checkov:skip=CKV_K8S_10:CPU requests are deployment-specific.
      # checkov:skip=CKV_K8S_11:CPU limits are deployment-specific.
      # checkov:skip=CKV_K8S_12:Memory requests are deployment-specific.
      # checkov:skip=CKV_K8S_13:Memory limits are deployment-specific.
      # checkov:skip=CKV_K8S_20:Privilege escalation is controlled by the configurable container security context.
      # checkov:skip=CKV_K8S_21:The installer chooses the release namespace.
      # checkov:skip=CKV_K8S_22:Filesystem policy is controlled by the configurable container security context.
      # checkov:skip=CKV_K8S_23:Container UID policy is configurable.
      # checkov:skip=CKV_K8S_28:Capabilities are controlled by the configurable container security context.
      # checkov:skip=CKV_K8S_29:Pod security context is configurable.
      # checkov:skip=CKV_K8S_30:Container security context is configurable.
      # checkov:skip=CKV_K8S_31:Seccomp policy is controlled by the configurable pod security context.
      # checkov:skip=CKV_K8S_35:The application receives credentials from Kubernetes Secrets.
      # checkov:skip=CKV_K8S_37:Capabilities are controlled by the configurable container security context.
      # checkov:skip=CKV_K8S_38:Service account configuration is controlled by chart values.
      # checkov:skip=CKV_K8S_40:Container UID policy is configurable.
      # checkov:skip=CKV_K8S_43:The image repository supports versioned tags and configurable deployment digests.
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: snapshoter
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "chart.fullname" . }}
            - secretRef:
                name: {{ include "chart.fullname" . }}
          command:
            - tail
            - -f
            - /dev/null
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
