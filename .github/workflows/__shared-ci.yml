name: Internal - Common Continuous Integration tasks

on:
  workflow_call:
    inputs:
      candidate-images:
        description: Build temporary images for release validation
        type: boolean
        default: false
    secrets:
      OS_PASSWORD:
        description: OpenStack password used by the dry-run test
        required: true
      OS_PROJECT_ID:
        description: OpenStack project ID used by the dry-run test
        required: true
      OS_REGION_NAME:
        description: OpenStack region used by the dry-run test
        required: true
      OS_TENANT_ID:
        description: OpenStack tenant ID used by the dry-run test
        required: true
      OS_TENANT_NAME:
        description: OpenStack tenant name used by the dry-run test
        required: true
      OS_USERNAME:
        description: OpenStack user used by the dry-run test
        required: true
      OS_VOLUMES:
        description: OpenStack volume selection used by the dry-run test
        required: true
    outputs:
      artifact-id:
        description: Immutable artifact ID of the validated chart
        value: ${{ jobs.chart-testing.outputs.artifact-id }}
      archive-name:
        description: Validated chart archive basename
        value: ${{ jobs.chart-testing.outputs.archive-name }}
      checksum:
        description: SHA-256 of the validated chart archive
        value: ${{ jobs.chart-testing.outputs.checksum }}
      job-results:
        description: Results and outputs of build, lint and image validation jobs
        value: ${{ toJSON(jobs) }}

permissions:
  contents: read

jobs:
  lint:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@f165c0ca3e88604611481e1408ace1e0e3a5ee47 # 4.3.1
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  docker-build-images:
    name: "Docker: Build Images"
    needs: lint
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
    permissions:
      attestations: write
      actions: read
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
    with:
      candidate: ${{ inputs.candidate-images }}
      images: |
        [{
          "name": "app",
          "repository": "${{ github.repository }}",
          "dockerfile": "./Dockerfile",
          "platforms": [
            "linux/amd64",
            "linux/arm64"
          ]
        }]

  chart-testing:
    needs: docker-build-images
    name: Tests - Charts
    uses: hoverkraft-tech/ci-github-container/.github/workflows/helm-chart-ci.yml@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
    permissions:
      contents: read
      packages: read
    with:
      path: helm/chart
      upload-artifact: ${{ inputs.candidate-images }}
      images: ${{ needs.docker-build-images.outputs.built-images }}
      helm-set: |
        image.tag=${{ fromJSON(needs.docker-build-images.outputs.built-images).app.tags[0] }}@${{ fromJSON(needs.docker-build-images.outputs.built-images).app.digest }}

  test-images:
    needs: docker-build-images
    name: "Tests: application"
    runs-on: ubuntu-latest
    outputs:
      validated-images: ${{ needs.docker-build-images.outputs.built-images }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check dry-run has no side effects
        run: bash tests/dry-run.sh

      - uses: hoverkraft-tech/ci-github-container/actions/docker/setup@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
        with:
          setup-docker: false
          setup-buildx: false
          built-images: ${{ needs.docker-build-images.outputs.built-images }}
          oci-registry-username: ${{ github.actor }}
          oci-registry-password: ${{ github.token }}

      - uses: hoverkraft-tech/ci-github-container/actions/docker/verify-images@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
        with:
          images: ${{ toJSON(fromJSON(needs.docker-build-images.outputs.built-images).app.images) }}
          certificate-identity: https://github.com/hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@b055d6ce0f3a5e223615ad494d88d92e17af11e5

      - name: Verify application dry-run output
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          docker run --rm -i \
            -e DRY_RUN=true \
            -e CLEANUP=true \
            -e OS_PASSWORD \
            -e OS_PROJECT_ID \
            -e OS_REGION_NAME \
            -e OS_TENANT_ID \
            -e OS_TENANT_NAME \
            -e OS_USERNAME \
            -e OS_VOLUMES \
            "$IMAGE" > "$output"
          grep -q "would create snapshot $(date +%Y%m%d)" "$output"
          grep -q "would remove snapshot with id=" "$output"
        env:
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_PROJECT_ID: ${{ secrets.OS_PROJECT_ID }}
          OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
          OS_TENANT_ID: ${{ secrets.OS_TENANT_ID }}
          OS_TENANT_NAME: ${{ secrets.OS_TENANT_NAME }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_VOLUMES: ${{ secrets.OS_VOLUMES }}
          IMAGE: ${{ fromJSON(needs.docker-build-images.outputs.built-images).app.images[0] }}
