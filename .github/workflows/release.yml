---
# Prepare committed chart versions, validate the dispatched tag, then publish.
name: Release

on:
  # checkov:skip=CKV_GHA_7:Force overrides only the no-change plan, never validation or publication checks.
  workflow_dispatch:
    inputs:
      force:
        description: Release even without changes
        type: boolean
        default: false
  schedule:
    - cron: "25 8 * * 1"

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    uses: hoverkraft-tech/ci-github-container/.github/workflows/prepare-chart-release.yml@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
    permissions:
      actions: write
      contents: write
      pull-requests: read
    with:
      path: helm/chart
      update-app-version: true
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      github-app-client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
    secrets:
      github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

  validate:
    needs: prepare
    if: needs.prepare.outputs.status == 'ready'
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      issues: write
      packages: write
      pull-requests: write
      security-events: write
      statuses: write
    with:
      candidate-images: true
    secrets:
      OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
      OS_PROJECT_ID: ${{ secrets.OS_PROJECT_ID }}
      OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
      OS_TENANT_ID: ${{ secrets.OS_TENANT_ID }}
      OS_TENANT_NAME: ${{ secrets.OS_TENANT_NAME }}
      OS_USERNAME: ${{ secrets.OS_USERNAME }}
      OS_VOLUMES: ${{ secrets.OS_VOLUMES }}

  promote:
    needs: validate
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-promote-images.yml@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
    permissions:
      actions: read
      attestations: read
      contents: read
      deployments: write
      packages: write
      pull-requests: read
    with:
      job-results: ${{ needs.validate.outputs.job-results }}
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  release-chart:
    name: Publish validated chart
    needs: [validate, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Publish and sign validated archive
        id: publish
        uses: hoverkraft-tech/ci-github-container/actions/helm/release-chart@b055d6ce0f3a5e223615ad494d88d92e17af11e5 # 4.2.0
        with:
          artifact-id: ${{ needs.validate.outputs.artifact-id }}
          archive-name: ${{ needs.validate.outputs.archive-name }}
          checksum: ${{ needs.validate.outputs.checksum }}
          oci-repository: hoverkraft-tech/charts

  release:
    needs: [prepare, release-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: hoverkraft-tech/ci-github-publish/actions/release/create@d034b96d52f6f32c58a93bcd87a06932f50d8b26 # 3.1.0
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          target-ref: ${{ github.sha }}
          changelog-summary: ${{ format('{{"llmAuth":{0},"llmProvider":"openai"}}', toJSON(secrets.OPENAI_API_KEY)) }}
