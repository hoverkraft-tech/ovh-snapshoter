# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    directories:
      - "/"
    open-pull-requests-limit: 3
    labels:
      - "github_actions"
    schedule:
      interval: "weekly"
      day: friday
      time: "04:00"

  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/"
    open-pull-requests-limit: 3
    labels:
      - "docker"
    schedule:
      interval: "weekly"
      day: friday
      time: "04:10"

  - package-ecosystem: "pip"
    cooldown:
      default-days: 7
    directory: "/"
    open-pull-requests-limit: 3
    labels:
      - "pip"
    schedule:
      interval: "weekly"
      day: friday
      time: "04:20"

  - package-ecosystem: "devcontainers"
    directory: "/"
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: "weekly"
      day: friday
      time: "04:30"
    groups:
      devcontainer-dependencies:
        patterns:
          - "*"
